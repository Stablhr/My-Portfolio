<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aries B. Samson - Web Developer Portfolio. Building clean, responsive and interactive websites with React and Tailwind CSS." />
    <meta name="theme-color" content="#050608" />
    <title>Aries B. Samson | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Critical inline styles: run before the JS/CSS bundle so refreshing never
      flashes a white page or a bare "Skip to content" link. React replaces the
      #root skeleton below as soon as it mounts.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(1200px 600px at 100% 0%, rgba(27, 111, 168, 0.35), transparent 60%),
          radial-gradient(900px 500px at 0% 100%, rgba(10, 42, 68, 0.55), transparent 60%),
          #050608;
        color: #f2f4f8;
        font-family: "Montserrat", system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Accessible skip link, hidden until focused (no unstyled flash). */
      .skip-link {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .skip-link:focus {
        position: fixed;
        top: 1rem;
        left: 1rem;
        width: auto;
        height: auto;
        margin: 0;
        padding: 0.5rem 1rem;
        overflow: visible;
        clip: auto;
        clip-path: none;
        background: #6cc4ff;
        color: #050608;
        border-radius: 9999px;
        z-index: 50;
      }

      /* ---- Loading skeleton ---- */
      .sk {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
      }
      .sk::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09), transparent);
        animation: sk-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes sk-shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk::after {
          animation: none;
        }
      }
      .sk-container {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 640px) {
        .sk-container {
          padding: 0 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .sk-container {
          padding: 0 2rem;
        }
      }
      .sk-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
      }
      .sk-navrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 4rem;
      }
      @media (min-width: 768px) {
        .sk-navrow {
          height: 5rem;
        }
      }
      .sk-navpill {
        width: 22rem;
        height: 2.75rem;
        border-radius: 9999px;
        display: none;
      }
      .sk-logo {
        width: 8rem;
        height: 1.5rem;
        border-radius: 0.375rem;
      }
      @media (min-width: 768px) {
        .sk-logo {
          width: 2.25rem;
        }
      }
      .sk-burger {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.5rem;
      }
      @media (min-width: 768px) {
        .sk-navpill {
          display: block;
        }
        .sk-burger {
          display: none;
        }
      }
      .sk-hero {
        min-height: 100svh;
        display: flex;
        align-items: center;
        padding: 6rem 0 4rem;
      }
      .sk-grid {
        display: grid;
        gap: 2.5rem;
        width: 100%;
        align-items: center;
      }
      @media (min-width: 1024px) {
        .sk-grid {
          grid-template-columns: 1fr 1fr;
          gap: 5rem;
        }
      }
      .sk-avatar {
        aspect-ratio: 1 / 1;
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        border-radius: 1rem;
      }
      @media (min-width: 1024px) {
        .sk-avatar {
          margin: 0;
        }
      }
      .sk-copy {
        text-align: center;
      }
      @media (min-width: 1024px) {
        .sk-copy {
          text-align: left;
        }
      }
      .sk-line {
        height: 1rem;
        border-radius: 9999px;
        margin: 0 auto;
      }
      @media (min-width: 1024px) {
        .sk-line {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root">
      <div role="status" aria-label="Loading portfolio" aria-live="polite">
        <div class="sk-nav">
          <div class="sk-container">
            <div class="sk-navrow">
              <div class="sk sk-logo"></div>
              <div class="sk sk-navpill"></div>
              <div class="sk sk-burger"></div>
            </div>
          </div>
        </div>
        <div class="sk-container">
          <div class="sk-hero">
            <div class="sk-grid">
              <div class="sk sk-avatar"></div>
              <div class="sk-copy">
                <div class="sk sk-line" style="width: 9rem; height: 0.75rem"></div>
                <div class="sk sk-line" style="width: min(80%, 20rem); height: 4.5rem; margin-top: 1.25rem; border-radius: 1rem"></div>
                <div class="sk sk-line" style="width: min(60%, 14rem); height: 2.25rem; margin-top: 1rem; border-radius: 1rem"></div>
                <div class="sk sk-line" style="width: min(100%, 26rem); margin-top: 2rem"></div>
                <div class="sk sk-line" style="width: min(85%, 22rem); margin-top: 0.75rem"></div>
                <div class="sk sk-line" style="width: 12rem; height: 3rem; margin-top: 2rem; border-radius: 9999px"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
